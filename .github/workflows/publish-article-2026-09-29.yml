name: Publish second AI practice article

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-article-2026-09-29.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.publish.outputs.deploy }}
    steps:
      - name: Publish the reviewed article now
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/1")
          if [[ $(jq -r '.merged_at' <<< "$pr") != null ]]; then
            echo 'Article PR is already merged.'
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ $(jq -r '.state' <<< "$pr") != open ]]; then
            echo 'Article PR is closed without publication.' >&2
            exit 1
          fi
          if [[ $(jq -r '.base.ref' <<< "$pr") != main ||
                $(jq -r '.head.sha' <<< "$pr") != 4b0efcca9b62294feeaff0d8c5e9055f1eb18d54 ]]; then
            echo 'Article PR changed after review; stopping publication.' >&2
            exit 1
          fi

          if [[ $(jq -r '.draft' <<< "$pr") == true ]]; then
            gh pr ready 1 --repo "$GITHUB_REPOSITORY"
          fi
          gh pr merge 1 --repo "$GITHUB_REPOSITORY" --squash
          echo 'deploy=true' >> "$GITHUB_OUTPUT"

  build:
    if: needs.release.outputs.deploy == 'true'
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    if: needs.release.outputs.deploy == 'true'
    needs: [release, build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
