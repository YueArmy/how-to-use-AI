<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  html { background: #f7f4ef; }
  body { margin: 0; background: #f7f4ef; color: #2a2723; -webkit-font-smoothing: antialiased; }
  ::selection { background: #f2d9d0; }
  a { color: #a8412a; text-decoration: none; }
  a:hover { color: #7d2e1c; }
</style>
</helmet>

<div style="font-family:'Noto Sans JP',sans-serif;font-size:clamp(16px,15.5px + .21vw,17px);line-height:1.95;letter-spacing:.02em">
  <div style="max-width:1080px;margin:0 auto;padding:{{ shellPad }}">

    <header style="padding:{{ headPad }};display:flex;flex-direction:column;gap:18px">
      <span style="width:26px;height:1px;background:#c9beb2"></span>

      <h1 style="margin:0;font-family:'Noto Serif JP',serif;font-weight:700;font-size:clamp(26px,20.6px + 1.44vw,38px);line-height:1.4;letter-spacing:-.01em;color:#171512">AI PRACTICE / <span style="color:#a8412a">NOTES</span><span style="display:block;margin-top:16px;font-family:'Noto Sans JP',sans-serif;font-size:clamp(15px,14.5px + .21vw,16px);font-weight:400;line-height:1.6;letter-spacing:.02em;color:#4c4741">AI活用について、実際にやったことをもとに書いています。<br />うまくいかなかったところも含めて。</span></h1>

    </header>

    <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;padding:{{ barPad }};border-bottom:1px solid #171512">
      <span style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;color:#171512">ALL {{ count }}</span>
      <span style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.14em;color:#8a8178">{{ orderLabel }}</span>
    </div>

    <ul style="list-style:none;margin:0;padding:0 0 120px;display:flex;flex-direction:column;gap:0">
      <sc-for list="{{ posts }}" as="post">
        <li style="border-bottom:1px solid #e9e0d3">
          <a href="{{ post.url }}" style="display:grid;grid-template-columns:{{ rowCols }};gap:{{ rowGap }};padding:{{ rowPad }};color:inherit;text-decoration:none;align-items:{{ rowAlign }}" style-hover="background:#fffdfa">
            <span style="display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em;color:#8a8178;padding-top:{{ metaTop }}">
              <span>{{ post.date }}</span>
              <sc-if value="{{ showMinutes }}" hint-placeholder-val="{{ false }}">
                <span style="color:#c0b6aa;white-space:nowrap">/ {{ post.minutes }}分</span>
              </sc-if>
            </span>

            <sc-if value="{{ post.thumb }}" hint-placeholder-val="{{ false }}">
              <span style="display:block;width:{{ thumbWidth }};aspect-ratio:16/9;border:1px solid #e9e0d3;background-image:{{ post.thumbCss }};background-size:cover;background-position:center"></span>
            </sc-if>

            <span style="display:flex;flex-direction:column;gap:8px;min-width:0;max-width:40em;margin:{{ textMargin }}">
              <span style="font-family:'Noto Serif JP',serif;font-weight:700;font-size:clamp(18px,16.4px + .43vw,21px);line-height:1.65;color:#171512;text-wrap:pretty">{{ post.title }}</span>
              <span style="font-size:14px;line-height:1.9;color:#4c4741;max-width:40em;text-wrap:pretty">{{ post.description }}</span>
              <sc-if value="{{ showSource }}" hint-placeholder-val="{{ false }}">
                <span style="font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.1em;color:#a89e93">{{ post.source }}</span>
              </sc-if>
            </span>

            <span style="display:flex;justify-content:{{ kindAlign }};padding-top:{{ metaTop }}">
              <span style="font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;color:#6b645b;white-space:nowrap">{{ post.kind }}</span>
            </span>
          </a>
        </li>
      </sc-for>
    </ul>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;showThumb&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;一覧に出す情報&quot;},&quot;showMinutes&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;一覧に出す情報&quot;},&quot;showSource&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;一覧に出す情報&quot;}}">
class Component extends DCLogic {
  state = { narrow: false };
  componentDidMount() {
    this.mq = window.matchMedia("(max-width: 860px)");
    this.onMq = () => this.setState({ narrow: this.mq.matches });
    this.mq.addEventListener("change", this.onMq);
    this.onMq();
  }
  componentWillUnmount() {
    this.mq.removeEventListener("change", this.onMq);
  }
  renderVals() {
    const narrow = this.state.narrow;
    const withThumb = this.props.showThumb ?? false;
    const posts = [
      {
        url: "posts/2026-09-02-what-you-want-not-what-ai-can-do/",
        title: "AI活用は「何ができるか」ではなく「何をしたいか」",
        description: "「AIで何ができるか」を調べるほど、自分の仕事から遠ざかっていく。効いたのは、AIの知識ではなく、考える順番でした。",
        date: "2026.09",
        minutes: 8,
        thumb: withThumb ? "images/hero_desk_notes.png" : null,
        thumbCss: withThumb ? "url('images/hero_desk_notes.png')" : "none",
        kind: "コラム",
        source: "掲示板"
      }
    ];
    return {
      posts: posts,
      count: String(posts.length).padStart(2, "0"),
      orderLabel: "NEWEST FIRST",
      showThumb: withThumb,
      thumbWidth: narrow ? "100%" : "196px",
      showMinutes: this.props.showMinutes ?? true,
      showSource: this.props.showSource ?? false,
      shellPad: narrow ? "0 20px" : "0 28px",
      headPad: narrow ? "56px 0 0" : "72px 0 0",
      barPad: narrow ? "40px 0 12px" : "52px 0 14px",
      rowCols: narrow
        ? "minmax(0,1fr)"
        : (withThumb ? "124px 196px minmax(0,1fr) 88px" : "124px minmax(0,1fr) 88px"),
      rowGap: narrow ? "10px" : "24px",
      rowPad: narrow ? "20px 0 22px" : "20px 8px 22px",
      rowAlign: "start",
      textMargin: "0",
      metaTop: narrow ? "0px" : "5px",
      kindAlign: narrow ? "flex-start" : "flex-end"
    };
  }
}
</script>
</body>
</html>
